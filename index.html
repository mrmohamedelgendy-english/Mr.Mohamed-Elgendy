<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a2a6e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>الأستاذ محمد الجندي | EL GENDY IN ENGLISH</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Great+Vibes&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--surf:#fff;--hdr:#0c1f4a;--ink:#0f172a;--mute:#5b6577;--gold:#b7791f;--goldbg:#f6d77a;--line:#d9dfec;--ok:#0f7a4f;--bad:#b4233c;--okbg:#d9f4e6;--badbg:#fbdde3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1f;--surf:#0f1a38;--hdr:#0a1634;--ink:#eef2fb;--mute:#9fb0d0;--gold:#f6c744;--goldbg:#3b3110;--line:#243461;--ok:#4ade9a;--bad:#ff8aa0;--okbg:#0e3a2a;--badbg:#4a1623;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070d1f;--surf:#0f1a38;--hdr:#0a1634;--ink:#eef2fb;--mute:#9fb0d0;--gold:#f6c744;--goldbg:#3b3110;--line:#243461;--ok:#4ade9a;--bad:#ff8aa0;--okbg:#0e3a2a;--badbg:#4a1623;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:10}
header{background:var(--hdr);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;border-bottom:3px solid var(--gold)}
.top{max-width:1000px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:#f6c744;color:#0c1f4a;display:grid;place-items:center;font-weight:900;font-size:22px;flex:none}
.top h1{margin:0;font-size:18px;color:#f6c744;line-height:1.3}.top small{color:#b9c6e6;font-size:12px;display:block}
nav{max-width:1000px;margin:auto;display:flex;overflow-x:auto;padding:0 8px}
nav button{flex:none;background:none;border:0;color:#c9d4ee;font:inherit;font-size:13px;font-weight:700;padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-3px;cursor:pointer;white-space:nowrap}
nav button.on{color:#f6c744;border-color:#f6c744}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:16px}
h2{font-size:18px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:26px;line-height:1.2}.stat span{color:var(--mute);font-size:13px}
.stat.bad b{color:var(--bad)}.stat.gold b{color:var(--gold)}.stat.ok b{color:var(--ok)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
form,.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px;flex:1 1 130px}
input,select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.btn{font:inherit;font-weight:700;font-size:13px;padding:9px 16px;border-radius:8px;border:0;background:#f6c744;color:#0c1f4a;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:12px}.btn.del{background:var(--badbg);color:var(--bad)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:600;font-size:13px}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:700}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.g{background:var(--goldbg);color:var(--gold)}
.att{display:flex;gap:6px}.att .btn{background:transparent;border:1px solid var(--line);color:var(--ink)}
.att .btn.p.on{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.att .btn.a.on{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.empty{color:var(--mute);padding:14px;text-align:center}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:700}
.sc{display:flex;align-items:center;gap:8px;margin:6px 0}.sc span{flex:1}.sc input{width:90px}
.ltr{direction:ltr;unicode-bidi:embed}
header,body::before{background:#0a2a6e}header{border-bottom-color:#ffe81a}
.logo{background:#ffe81a;color:#0a2a6e}.top h1{color:#ffe81a}
nav button.on{color:#ffe81a;border-color:#ffe81a}.btn{background:#ffe81a;color:#0a2a6e}
.sign{background:#0a2a6e;border-radius:16px;padding:22px 14px;text-align:center;margin-bottom:16px;border:1px solid rgba(255,232,26,.4)}
.sign .t{color:#ffe81a;font-weight:800;font-size:20px}.sign .n{color:#fff;font-weight:900;font-size:clamp(34px,9vw,52px);line-height:1.15}
.sign .s{color:#ffe81a;font-weight:800;font-size:18px;margin:10px 0 12px}
.sign .ph2{display:inline-block;direction:ltr;border-inline:16px solid #ffe81a;padding:4px 12px;color:#fff;font-weight:900;font-size:clamp(18px,5vw,24px);line-height:1.5}
.sign .en{color:#ffe81a;font-weight:900;font-size:clamp(30px,8vw,42px);font-style:italic;margin-top:14px;line-height:1.1;direction:ltr}
.sign .en i{display:block;height:5px;border-radius:5px;background:#ffe81a;width:70%;margin:4px auto 0}
.sign .in{color:#fff;letter-spacing:.4em;font-weight:800;font-size:14px;margin-top:10px;direction:ltr}

:root{--bg:#f5f3ec}
body{background-image:radial-gradient(rgba(10,42,110,.07) 1px,transparent 1.2px);background-size:16px 16px}
h2{text-decoration:underline;text-decoration-color:#ffe81a;text-decoration-thickness:7px;text-underline-offset:-3px;text-decoration-skip-ink:none;font-weight:900}
.card,.stat{border:2px solid #0a2a6e;border-radius:14px;box-shadow:-5px 5px 0 #ffe81a}
.stat b{font-weight:900;font-size:30px}
.btn{border:2px solid #0a2a6e;border-radius:10px;font-weight:900;box-shadow:-3px 3px 0 #0a2a6e}.btn:active{transform:translate(-2px,2px);box-shadow:-1px 1px 0 #0a2a6e}
.btn.sec,.btn.del,.att .btn{box-shadow:none}
nav button.on{background:#ffe81a;color:#0a2a6e;border-radius:10px 10px 0 0}
.hero{position:relative;margin-bottom:26px;display:grid;gap:14px;justify-items:center;text-align:center}
.blob{background:#0a2a6e;clip-path:polygon(1% 10%,9% 1%,28% 5%,50% 0,73% 5%,95% 1%,100% 22%,97% 48%,100% 74%,95% 98%,72% 94%,48% 100%,24% 95%,5% 99%,0% 72%,3% 44%);padding:28px 36px 26px;width:min(430px,100%)}
.blob .sub{color:#fff;font-weight:700;font-size:14px;margin-top:8px}
.hl{background:#ffe81a;color:#0a2a6e;font-weight:900;font-size:clamp(24px,6.5vw,38px);line-height:1.4;padding:6px 28px;transform:rotate(-1.5deg);clip-path:polygon(0 14%,3% 0,40% 7%,100% 0,98% 55%,100% 100%,60% 92%,2% 100%,4% 50%)}
.hero .tag{font-weight:900;font-size:21px;color:var(--ink);transform:rotate(-3deg)}
.phs{display:flex;gap:10px 22px;flex-wrap:wrap;justify-content:center;direction:ltr}.phs div{display:flex;align-items:center;gap:8px}
.phs i{width:36px;height:36px;border-radius:50%;background:#ffe81a;display:grid;place-items:center}.phs b{font-size:clamp(18px,5vw,25px);font-weight:900;color:var(--ink)}
.dds{display:flex;gap:26px;justify-content:center;color:var(--ink)}.dd{width:42px;fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
@media(min-width:760px){.dds{display:contents}.dd{position:absolute;width:56px}.d1{top:4px;left:3%}.d2{bottom:30px;right:3%;width:50px}.d3{top:10px;right:5%;width:42px}}

.hl{margin-top:4px}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-inline-end:8px;border:2px solid #ffe81a;background:var(--goldbg);display:inline-grid;place-items:center;font-weight:900;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.idc{background:#fff;color:#0a2a6e;border:2px solid #0a2a6e;border-radius:12px;padding:10px;text-align:center;break-inside:avoid}
.idc .t{background:#0a2a6e;color:#ffe81a;font-weight:900;font-size:12px;border-radius:6px;padding:2px;margin-bottom:8px}
.idc .av{width:48px;height:48px;margin:0 0 4px;color:#0a2a6e}.idc img.q{width:120px;height:120px;image-rendering:pixelated;margin:6px auto;display:block}
@media print{header,nav,.noprint,footer,body::before{display:none!important}body{background:#fff}main{padding:0}}
.att .btn.c.on{background:var(--goldbg);color:var(--gold);border-color:var(--gold)}
details ul{margin:6px 0 10px;padding-inline-start:20px}details li{margin-bottom:4px}
#pdlg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#pdlg .box{background:var(--surf);color:var(--ink);border:2px solid #0a2a6e;border-radius:14px;box-shadow:-6px 6px 0 #ffe81a;padding:16px;width:min(420px,100%);max-height:90vh;overflow:auto}
.certp{page-break-after:always;margin:0 0 12px}.certp img{width:100%;display:block}
@media print{.certp{margin:0}@page{margin:8mm}}

 return'<div class="card"><h2>صورة الشهادة</h2><p style="margin:0 0 8px;color:var(--mute);font-size:13px">ارفع صورة شهادة التقدير فاضية من الاسم، وحدد مكان وشكل الاسم الإنجليزي. الصورة بتتحفظ على هذا الجهاز ومش داخل النسخة الاحتياطية.</p><div class="row"><label>رفع صورة الشهادة<input type="file" class="cf" accept="image/*"></label>'+(certTpl?'<button class="btn sm del" data-a="certdel">حذف الصورة</button>':"")+'</div>'+(certTpl?'<div class="row" style="margin-top:10px"><label>مكان الاسم أفقيًا<input type="range" class="cin" data-k="x" min="0" max="100" value="'+c.x+'"></label><label>مكان الاسم رأسيًا<input type="range" class="cin" data-k="y" min="0" max="100" value="'+c.y+'"></label><label>حجم الخط<input type="range" class="cin" data-k="s" min="2" max="14" step="0.5" value="'+c.s+'"></label><label>اللون<input type="color" class="cin" data-k="c" value="'+c.c+'"></label><label>الخط<select class="cin" data-k="f">'+opts([{v:"script",t:"مزخرف (Script)"},{v:"serif",t:"كلاسيكي (Serif)"},{v:"sans",t:"بسيط (Sans)"}],c.f)+'</select></label></div><img id="cprev" alt="" style="display:none;width:100%;margin-top:10px;border-radius:8px;border:1px solid var(--line)">':'<p style="margin:10px 0 0">ارفع الصورة عشان تظهر المعاينة.</p>')+'</div>'+

guide:function(){var G=[["البداية السريعة",["الأقسام: الشريط فيه ٨ أقسام أساسية. الجدول والواجب والشهادات مخفيين، فعّلهم من لوحة التحكم (كارت الإعدادات). الرسائل فيها واتساب وتيليجرام، والتقارير فيها اليومي والكشوف، وزرار ؟ الدليل في آخر الشريط. اسم أي طالب في القوايم بيفتح ملفه.","أضف مجموعاتك من تبويب الطلاب والمجموعات.","أضف الطلاب يدويًا أو استوردهم من ملف Excel.","صورتك الشخصية: في لوحة التحكم اضغط تغيير الصورة تحت صورتك لاختيار صورة جديدة، وزرار الصورة الأصلية بيرجع الصورة القديمة. وصورة أي طالب بتتغير من زرار تعديل.","حدد أيام ومواعيد وسعر كل مجموعة في جدول وأسعار المجموعات. السعر بيتحط تلقائي لما تضيف طالب في المجموعة، وزرار تطبيق على كل الطلاب بيحدّث اشتراك الطلاب الحاليين. وتبويب الحضور بيفتح على مجموعة النهارده.","سجّل الحضور والمدفوعات أولًا بأول، والتقارير بتتجمع لوحدها."]],
 ["الطلاب والمجموعات",["إضافة طالب: الاسم، رقم ولي الأمر، رقم الطالب، المجموعة، الاشتراك، الخصم الشهري، والصورة. الكود بيتولد تلقائي (١٠٠١، ١٠٠٢...).","البحث: خانة البحث فوق قائمة الطلاب بتدور بالاسم أو الكود أو الهاتف.","عرض مجموعة والتحضير: اختار المجموعة من القائمة فوق الطلاب، فيظهر طلابها وجنب كل اسم زراير حاضر وغائب وتعويض حسب التاريخ المختار.","التعديل: زرار تعديل لتغيير أي بيانات أو نقل الطالب لمجموعة تانية.","المجموعات: جنب كل مجموعة في كارت المجموعات زرار تعديل (لتغيير الاسم) وزرار حذف. لو فيها طلاب بتختار مجموعة تنقلهم ليها قبل الحذف.","ملف الطالب (زرار ملف): حضوره وغيابه والواجب والدرجات واشتراكات آخر ٦ شهور وملاحظاتك.","الأرشفة: لو الطالب ترك المجموعة اضغط أرشفة من ملفه بدل الحذف. بيختفي من الحضور والمدفوعات وتفضل بياناته، وتشوفه بخانة عرض المؤرشفين.","استيراد Excel: الصف الأول عناوين (الاسم، الهاتف، المجموعة، الاشتراك). فيه زرار لتنزيل نموذج جاهز."]],
 ["البطاقات والباركود",["زرار بطاقات وباركود بيطلع بطاقة لكل طالب فيها الصورة والاسم والكود وQR.","اختار المجموعة وعدد البطاقات في الورقة (من ٦ لحد ٤٠، والمضغوطة بدون صور) واضغط طباعة، وقصّ البطاقات على الخطوط المتقطعة. أو اطبع بطاقة واحدة من زرار بطاقة جنب الطالب."]],
 ["الحضور والغياب",["اختار التاريخ والمجموعة، وسجّل حاضر أو غائب أو تعويض (الحصة التعويضية لا تُحسب غياب).","مسح الكاميرا: اضغط فتح الكاميرا ووجّهها على QR الطالب فيتسجل حاضر مع صوت واسم وصورة.","أو اكتب الكود واضغط Enter، وده بيشتغل مع سكانر USB كمان.","بعد المسح اضغط تسجيل الباقي غياب لتسجيل من لم يحضر.","كشف الشهر للطباعة: جدول بكل أيام الشهر لكل طالب.","لو طالب غاب ٣ مرات متتالية بيظهر تنبيه في لوحة التحكم مع زرار رسالة لولي الأمر."]],
 ["المصاريف (الاشتراكات)",["اختار الطالب والنوع والشهر والمبلغ. الدفع الجزئي مسموح، والمتبقي بيتحسب ويظهر في من لم يدفع.","الخصم الشهري بتحدده من بيانات الطالب، وبيتخصم من الاشتراك تلقائيًا.","زرار إيصال جنب أي دفعة بيفتح واتساب برسالة لولي الأمر بالمبلغ والمتبقي.","دفع سريع: جنب كل اسم في التحضير (تبويب الطلاب بعد اختيار مجموعة، أو تبويب الحضور) زرار دفع بيفتح نافذة فيها الشهر (تقدر تغيره) والمدفوع والمتبقي، وتكتب المبلغ فيظهرلك كام هيتبقى قبل التأكيد، وبعد التسجيل تقدر تبعت الإيصال.","حالة الدفع بالمجموعة: في تبويب المصاريف اختار الشهر والمجموعة والحالة (الكل أو دفعوا أو لم يدفعوا) وشوف مين سدد ومين لأ."]],
 ["من لم يدفع",["اختار الشهر والمجموعة وشوف المتبقي على كل طالب.","زرار تذكير يفتح واتساب برسالة مهذبة لولي الأمر، وتسجيل دفع بيسجل المتبقي كاملًا."]],
 ["الامتحانات ولوحة الشرف",["أنشئ الامتحان بعنوان ودرجة ورابط (Google Forms أو Drive) ومجموعة.","زرار إرسال للجروب بيفتح واتساب برسالة جاهزة، وإنت بتختار الجروب وتضغط إرسال.","الدرجات تُدخل يدويًا أو تُستورد من Excel: عمود كود أو اسم وعمود درجة.","إدخال سريع للدرجات: افتح إدخال الدرجات، اكتب اسم الطالب أو كوده في خانة البحث واضغط Enter، اكتب الدرجة واضغط Enter، فتتحفظ وتفضى الخانة للطالب اللي بعده.","لوحة الشرف بتعرض أعلى ١٠ طلاب بمتوسط الامتحانات."]],
 ["الواجب",["من تبويب الواجب سجّل حلّ أو لم يحل لكل طالب، وبيظهر في ملف الطالب وتقرير ولي الأمر."]],
 ["الأرباح والمصروفات",["سجّل مصروفاتك (إيجار، مطبوعات، مساعد) واختار الشهر.","الصافي = التحصيل (الدفعات اللي استلمتها في الشهر) ناقص المصروفات."]],
 ["تقارير أولياء الأمور وصور السبورة",["ارفع صور السبورة على Drive أو تيليجرام والصق رابط كل مجموعة في كارت رابط صور السبورة.","زرار تقرير جنب الطالب بيفتح واتساب برسالة فيها الحضور والواجب والدرجات وحالة الدفع ورابط الصور."]],
 ["النسخ الاحتياطي والأمان",["بياناتك محفوظة على هذا الجهاز وهذا المتصفح فقط، فنزّل نسخة احتياطية كل أسبوع (التطبيق بيفكرك).","الاسترجاع من ملف النسخة بيستبدل البيانات الحالية. وتصدير Excel بيطلع كل البيانات في ملف واحد.","الحفظ على ملف في الجهاز: في لوحة التحكم اضغط إنشاء ملف جديد (أو فتح ملف موجود) فكل تغيير بيتحفظ تلقائيًا في الملف ده، زي زرار حفظ. بيشتغل على كروم أو إيدج في الكمبيوتر فقط، وممكن يطلب إذن كل مرة تفتح التطبيق.","قفل التطبيق: رقم سري من ٤ إلى ٨ أرقام. هو قفل بسيط يمنع الفضول وليس تشفيرًا قويًا.","لو نسيت الرقم: امسح بيانات الموقع من المتصفح ثم استرجع آخر نسخة احتياطية (النسخة لا تحتوي الرقم السري).","مسح كل البيانات: زرار في آخر لوحة التحكم، بيطلب تأكيد مرتين (نافذة تحذير ثم كتابة كلمة مسح)، وبيمسح كل شيء ما عدا القفل. نزّل نسخة احتياطية قبله."]],
 ["الجدول والإرسال السريع والرسوم",["الجدول: بيعرض كل يوم مجموعاته ومواعيدها، وزرار تحضير بيفتح المجموعة مباشرة.","الإرسال السريع: اختار نوع الرسالة (تذكير بالمتأخرين، تقرير الشهر، غياب متكرر) والمجموعة واضغط تجهيز القائمة. زرار فتح واتساب بيفتح رسالة الطالب الحالي وينتقل للتالي، وإنت بس بتضغط إرسال في واتساب.","لو المتصفح منع فتح واتساب، استخدم الرابط المباشر ثم اضغط تم الإرسال، التالي.","الرسوم البيانية في آخر لوحة التحكم: إيرادات ٦ شهور، وحضور المجموعات، ونسبة الدفع."]],
 ["تيليجرام (إرسال تلقائي)",["الإعداد: افتح @BotFather في تيليجرام واكتب /newbot، وخد التوكن والصقه في تبويب تيليجرام واضغط حفظ واختبار.","ربط ولي الأمر: ابعتله رابط الربط (من تبويب تيليجرام أو ملف الطالب أو الإرسال السريع بنوع رابط ربط تيليجرام) واطلب منه يضغط Start. الربط بيتم تلقائيًا وإنت فاتح التطبيق، أو اضغط تحديث الربط. أكتر من ولي أمر (أب وأم) يقدروا يربطوا نفس الطالب.","الإرسال التلقائي: لما تسجل غياب أو دفعة أو درجة بيوصل لولي الأمر المربوط رسالة لوحدها. تقدر تغير النص وتوقف أي نوع. ومفيش تكرار لنفس الغياب أو الدرجة.","أزرار ولي الأمر: بعد الربط بتظهر له أزرار في تيليجرام (الدرجات، التقرير، الحضور والغياب، المصاريف) يطلب منها أي معلومة عن ابنه. الرد بيوصل وإنت فاتح التطبيق (خلال حوالي ٢٠ ثانية).","تنبيهات: بيشتغل من النسخة المثبتة أو الملف المحمّل مش من لينك claude.ai. الإرسال بيحصل والتطبيق مفتوح وفيه إنترنت. التوكن بيتخزن على جهازك فقط ولا يدخل النسخة الاحتياطية. اربط الأهالي من جهاز واحد."]],
 ["البحث السريع والتقرير اليومي والكشوف",["البحث السريع: الخانة في أعلى الصفحة (تحت العنوان) اكتب فيها كود الطالب أو اسمه أو رقمه، وتظهر النتايج. اضغط اسم الطالب أو Enter (يشتغل مع سكانر الباركود) لفتح ملفه، وجنب كل نتيجة زرار دفع للاشتراك وزرار تعديل مباشرة.","التقرير اليومي: اختار التاريخ وشوف التحصيل والمصروفات والصافي والمدفوعات والحضور بالمجموعات والغائبين. فيه طباعة وإرسال واتساب.","كشوف وتقارير: كشف أسماء (للتحضير الورقي بخانات فاضية)، تقرير مجموعة (حضور وواجب وامتحانات واشتراك الشهر لكل طالب)، وكشف الدرجات (كل الامتحانات في جدول). كلهم بالطباعة."]],
 ["الشهادات وملخص الحصة وآخر الحركات",["الشهادات: من تبويب الشهادات ارفع صورة شهادة التقدير فاضية من الاسم، وحرّك مكان الاسم وحجمه ولونه وخطه من الأشرطة وشوف المعاينة.","اكتب الاسم بالإنجليزي لكل طالب (من تبويب الشهادات أو من إضافة وتعديل الطالب)، واضغط معاينة وحفظ. على الموبايل اضغط مطولًا على الصورة لحفظها.","طباعة شهادات المجموعة بتطبع كل شهادة في صفحة. صورة الشهادة بتتحفظ على الجهاز ومش داخل النسخة الاحتياطية.","ملخص الحصة: زرار في التحضير بيطلع الحاضر والغائب (بالأسماء) والتعويض والتحصيل اليوم، وتبعته واتساب.","آخر الحركات: في لوحة التحكم آخر ١٠ عمليات (دفع، تحضير، إضافة وحذف الطلاب)."]],
 ["ملاحظات مهمة",["الكاميرا والتنزيل ممكن ما يشتغلوش داخل لينك claude.ai، فشغّل التطبيق من الملف المحمّل على جهازك.","واتساب بيفتح لشخص أو جروب واحد في كل مرة، ومفيش إرسال تلقائي.","استخدم نفس الجهاز ونفس المتصفح دايمًا عشان بياناتك تفضل قدامك."]]];
